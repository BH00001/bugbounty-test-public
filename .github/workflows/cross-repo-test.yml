name: Cross-Repo Push Test
on:
  workflow_dispatch:
jobs:
  cross-repo-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: BH00002/bugbounty-test-public
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Write test file
        run: |
          echo "Cross-repo test from BH00001 workflow - $(date)" > cross-repo-test.txt
          git config user.email "lcnmllr+test1@gmail.com"
          git config user.name "BH00001"
          git add cross-repo-test.txt
          git commit -m "Cross-repo push test from BH00001"
          git push origin main 2>&1 || echo "PUSH FAILED: $?"