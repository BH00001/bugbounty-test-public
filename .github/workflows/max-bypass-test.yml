name: "Safe Outputs Max Bypass Test"

on:
  workflow_dispatch:
    inputs:
      instance_id:
        description: "Unique ID per concurrent run"
        required: true
        default: "1"
      max_value:
        description: "max constraint on create_issue"
        required: false
        default: "1"

jobs:
  safe_outputs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout gh-aw actions folder
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: github/gh-aw
          sparse-checkout: |
            actions
          persist-credentials: false

      - name: Setup Scripts
        uses: ./actions/setup
        with:
          destination: ${{ runner.temp }}/gh-aw/actions

      - name: Prepare crafted agent output
        run: |
          mkdir -p /tmp/gh-aw
          INSTANCE="${{ github.event.inputs.instance_id }}"
          MAXVAL="${{ github.event.inputs.max_value || 1 }}"
          cat > /tmp/gh-aw/agent_output.json << AGENTEOF
          {"items":[{"type":"create_issue","title":"[MAX BYPASS] run ${INSTANCE}","body":"This issue proves max constraint bypassed via concurrent runs.\\n\\n- Instance: ${INSTANCE}\\n- max: ${MAXVAL}\\n- Run: ${{ github.run_id }}"}]}
          AGENTEOF
          cat /tmp/gh-aw/agent_output.json

      - name: Process Safe Outputs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          GH_AW_AGENT_OUTPUT: /tmp/gh-aw/agent_output.json
          GH_AW_SAFE_OUTPUTS_HANDLER_CONFIG: '{"create_issue":{"max":${{ github.event.inputs.max_value || 1 }},"labels":["max-bypass"],"title_prefix":"[MAX BYPASS] "}}'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { setupGlobals } = require('${{ runner.temp }}/gh-aw/actions/setup_globals.cjs');
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require('${{ runner.temp }}/gh-aw/actions/safe_output_handler_manager.cjs');
            await main();
